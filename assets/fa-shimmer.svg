<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="سریع. خصوصی. مال تو.">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.45" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4f8cff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>
  <text x="600" y="95" text-anchor="middle" direction="rtl"
        font-family="Tahoma, 'Segoe UI', Vazirmatn, IRANSans, sans-serif"
        font-size="64" font-weight="bold" fill="url(#shine)" filter="url(#soft)">سریع. خصوصی. مالِ تو.</text>
  <circle cx="600" cy="128" r="4" fill="#7c5cff">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
